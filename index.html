<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Results Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2E2E31;
    --panel:#3A3A3D;
    --panel-2:#454548;
    --line:#54545A;
    --text:#E7ECEF;
    --text-dim:#7E8894;
    --amber:#FF7A1A;
    --purple:#B453FF;
    --green:#33E37D;
    --red:#FF4D4D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    min-height:100vh;
    padding:0 0 4rem;
  }
  h1,h2,h3,.label{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;}

  header.hero{
    position:relative;
    border-bottom:1px solid var(--line);
    padding:2.2rem 1.5rem 1.6rem;
    background:
      linear-gradient(180deg, rgba(255,122,26,0.08), transparent 60%);
  }
  .social-links{
    position:absolute;
    top:1.3rem;
    right:1.5rem;
    display:flex;
    align-items:center;
    gap:.9rem;
  }
  .social-links a{
    color:var(--text-dim);
    display:flex;
    transition:color .15s;
  }
  .social-links a:hover{color:#fff;}
  .social-links svg{width:20px;height:20px;fill:currentColor;}
  .donate-btn{
    background:var(--amber);
    color:#111 !important;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:.75rem;
    font-weight:700;
    padding:.4rem .9rem;
    border-radius:16px;
    text-decoration:none;
  }
  .donate-btn:hover{color:#111 !important;filter:brightness(1.1);}
  .hero-inner{max-width:960px;margin:0 auto;}
  .team-logo{
    height:120px;
    margin-bottom:1rem;
    display:block;
  }
  .sponsor-strip{
    display:flex;
    align-items:center;
    gap:.7rem;
    margin-bottom:1.2rem;
    text-decoration:none;
    color:var(--text-dim);
    font-size:.8rem;
  }
  .sponsor-strip img{
    height:50px;
  }
  .eyebrow{color:var(--amber);font-size:.78rem;font-weight:600;letter-spacing:.14em;margin:0 0 .4rem;}
  h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;margin:0 0 .3rem;color:#fff;}
  .server-name{color:var(--text-dim);font-family:'IBM Plex Mono';font-size:.92rem;}
  .sync-note{color:var(--text-dim);font-size:.75rem;margin-top:.6rem;}

  main{max-width:960px;margin:0 auto;padding:1.6rem 1.5rem 0;}

  .game-tabs{display:flex;gap:.6rem;margin-bottom:1.2rem;}
  .game-tab{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.1em;
    font-size:.95rem;
    font-weight:700;
    padding:.7rem 1.8rem;
    border-radius:6px;
    cursor:pointer;
  }
  .game-tab[aria-selected="true"]{
    background:var(--amber);
    border-color:var(--amber);
    color:#111;
  }

  .category-tabs{display:flex;gap:.5rem;margin-bottom:1rem;}
  .category-tab{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:.82rem;
    font-weight:600;
    padding:.5rem 1.3rem;
    border-radius:20px;
    cursor:pointer;
  }
  .category-tab[aria-selected="true"]{
    background:var(--amber);
    border-color:var(--amber);
    color:#111;
  }

  .session-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem;}
  .session-tab{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:.8rem;
    font-weight:600;
    padding:.55rem 1rem;
    border-radius:3px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:.15rem;
  }
  .session-tab .date{
    color:var(--text-dim);
    font-size:.68rem;
    font-family:'IBM Plex Mono';
    letter-spacing:.02em;
  }
  .session-tab[aria-selected="true"] .date{color:#d9d9d9;}
  .session-tab[aria-selected="true"]{
    color:#fff;
    border-color:var(--amber);
    box-shadow:inset 0 0 0 1px var(--amber);
  }
  .session-tab .track{color:var(--text-dim);font-weight:400;margin-left:.4rem;}
  .session-tab[aria-selected="true"] .track{color:#d9d9d9;}

  .board{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .board-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:1rem 1.2rem .9rem;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  .board-head h2{font-size:1.15rem;margin:0;color:#fff;}
  .board-head .meta{color:var(--text-dim);font-family:'IBM Plex Mono';font-size:.78rem;}

  .class-tabs{display:flex;gap:.4rem;padding:.8rem 1.2rem 0;flex-wrap:wrap;}
  .class-tab{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:.72rem;
    font-weight:600;
    padding:.35rem .9rem;
    border-radius:14px;
    cursor:pointer;
  }
  .class-tab[aria-selected="true"]{
    background:var(--purple);
    border-color:var(--purple);
    color:#fff;
  }

  .view-tabs{display:flex;gap:1.4rem;padding:.9rem 1.2rem 0;border-bottom:1px solid var(--line);}
  .view-tab{
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:.8rem;
    font-weight:600;
    padding:.2rem 0 .6rem;
    cursor:pointer;
  }
  .view-tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--amber);}
  td.nw{white-space:nowrap;}
  .up{color:var(--green);}
  .down{color:var(--red);}

  table{width:100%;border-collapse:collapse;}
  .table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table{min-width:640px;}
  thead th{
    text-align:left;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    font-size:.68rem;
    letter-spacing:.08em;
    color:var(--text-dim);
    font-weight:600;
    padding:.55rem 1rem;
    border-bottom:1px solid var(--line);
  }
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  td{padding:.6rem 1rem;font-size:.86rem;vertical-align:middle;}
  td.pos{font-family:'Oswald',sans-serif;font-weight:700;font-size:1.05rem;color:#fff;width:2.4rem;}
  td.num{color:var(--text-dim);}
  td.driver{color:#fff;font-family:'IBM Plex Mono';}
  td.driver .car{display:block;color:var(--text-dim);font-size:.74rem;margin-top:.1rem;}
  td.time{color:#fff;font-variant-numeric:tabular-nums;}
  td.time.best{color:var(--purple);}
  .gap-cell{display:flex;align-items:center;gap:.6rem;min-width:9rem;}
  .gap-bar-track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .gap-bar-fill{height:100%;background:linear-gradient(90deg, var(--amber), var(--purple));}
  .gap-value{width:5.2rem;text-align:right;color:var(--text-dim);font-size:.8rem;}
  .pit-flag{color:var(--red);font-size:.72rem;margin-left:.4rem;}
  .status-flag{color:var(--red);font-size:.72rem;margin-left:.4rem;}

  .empty{
    padding:3rem 1.5rem;
    text-align:center;
    color:var(--text-dim);
  }
  .empty h2{color:#fff;margin-bottom:.5rem;}
  code{background:var(--panel-2);padding:.1rem .35rem;border-radius:3px;color:var(--amber);}

  footer{max-width:960px;margin:2rem auto 0;padding:0 1.5rem;color:var(--text-dim);font-size:.75rem;}

  @media (max-width: 640px) {
    header.hero{padding:1.6rem 1rem 1.2rem;}
    main{padding:1.2rem 1rem 0;}
    .team-logo{height:80px;}
    .board-head{flex-direction:column;align-items:flex-start;gap:.3rem;}
    .social-links{position:static;justify-content:center;margin-bottom:1rem;}
  }
</style>
</head>

<main>
  <nav class="game-tabs" id="game-tabs"></nav>
  <nav class="category-tabs" id="category-tabs"></nav>
  <nav class="session-tabs" id="session-tabs"></nav>
  <section class="board" id="board"></section>

<footer>
  ACC results pulled from the G-Portal server folder · LMU results from SimGrid pages and uploaded server result files.
</footer>

<script>
let DATA = { sessions: [], accLastSync: null, lmuLastSync: null };
let GAME = 'ACC';
let ACTIVE_ID = null;
let ACTIVE_CATEGORY = 'All';
let ACTIVE_SEASON = 'All';
let ACTIVE_CLASS = 'Overall';
let ACTIVE_VIEW = 'results';

async function fetchJson(path) {
  try {
    const res = await fetch(path, { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null;
  }
}

async function load() {
  const [accData, lmuData, importData] = await Promise.all([
    fetchJson('data/acc-results.json'),
    fetchJson('data/lmu-results.json'),
    fetchJson('data/lmu-imports.json'),
  ]);

  // LMU results can come from two places: SimGrid pages (data/lmu-results.json)
  // and uploaded game result files (data/lmu-imports.json). Where a season has
  // uploaded files, those are used for that whole season, because the SimGrid
  // pages only show logged-out visitors the top 5 of each class.
  const imported = (importData && importData.sessions) || [];
  const importedSeasons = new Set(imported.map(x => x.season));
  const scraped = ((lmuData && lmuData.sessions) || []).filter(x => !importedSeasons.has(x.season));

  // Newest first: latest season, then latest session within it.
  const lmuSessions = [...scraped, ...imported]
    .map((x, i) => ({ x, i }))
    .sort((a, b) =>
      (b.x.seasonOrder ?? 0) - (a.x.seasonOrder ?? 0) ||
      (a.x.startTime && b.x.startTime ? b.x.startTime.localeCompare(a.x.startTime) : b.i - a.i))
    .map(e => e.x);

  const lastLmu = [lmuData?.lastSync, importData?.lastSync].filter(Boolean).sort().pop() ?? null;

  DATA = {
    sessions: [...((accData && accData.sessions) || []), ...lmuSessions],
    accLastSync: accData?.lastSync ?? null,
    lmuLastSync: lastLmu,
  };
  render();
}

function formatSyncTime(iso) {
  if (!iso) return 'Not synced yet';
  const d = new Date(iso);
  return 'Last synced ' + d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function render() {
  const allSessions = DATA.sessions || [];

  document.getElementById('game-tabs').innerHTML = ['ACC', 'LMU'].map(g => `
    <button class="game-tab" data-game="${g}" aria-selected="${g === GAME}">${g}</button>
  `).join('');
  document.querySelectorAll('.game-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      GAME = btn.dataset.game;
      ACTIVE_ID = null;
      ACTIVE_CATEGORY = 'All';
      ACTIVE_SEASON = 'All';
      ACTIVE_CLASS = 'Overall';
      render();
    });
  });

  document.getElementById('sync-note').textContent =
    formatSyncTime(GAME === 'ACC' ? DATA.accLastSync : DATA.lmuLastSync);

  const gameSessions = allSessions.filter(s => s.game === GAME);

  if (gameSessions.length === 0) {
    document.getElementById('category-tabs').innerHTML = '';
    document.getElementById('session-tabs').innerHTML = '';
    document.getElementById('board').innerHTML = `
      <div class="empty">
        <h2>Waiting on the first ${GAME} sync</h2>
        <p>Once the sync workflow finds new results, sessions will show up here automatically.<br>
        Data source: <code>data/acc-results.json</code> / <code>data/lmu-results.json</code></p>
      </div>`;
    return;
  }

  // ACC has a PRO/PROAM (Wed/Thu) category split; LMU has a season split
  // (multiple championships tracked over time). Both reuse the same
  // #category-tabs element/styling since visually they're the same idea.
  if (GAME === 'ACC') {
    const categories = ['All', ...new Set(gameSessions.map(s => s.category || 'Other'))];
    document.getElementById('category-tabs').innerHTML = categories.map(cat => `
      <button class="category-tab" data-cat="${cat}" aria-selected="${cat === ACTIVE_CATEGORY}">${cat}</button>
    `).join('');
    document.querySelectorAll('.category-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        ACTIVE_CATEGORY = btn.dataset.cat;
        ACTIVE_ID = null;
        ACTIVE_CLASS = 'Overall';
        render();
      });
    });
  } else {
    const seasonOrder = new Map();
    gameSessions.forEach(s => seasonOrder.set(s.season || 'Other', s.seasonOrder ?? 0));
    const seasons = ['All', ...[...seasonOrder.entries()].sort((a, b) => a[1] - b[1]).map(([label]) => label)];
    document.getElementById('category-tabs').innerHTML = seasons.map(season => `
      <button class="category-tab" data-season="${season}" aria-selected="${season === ACTIVE_SEASON}">${season}</button>
    `).join('');
    document.querySelectorAll('.category-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        ACTIVE_SEASON = btn.dataset.season;
        ACTIVE_ID = null;
        ACTIVE_CLASS = 'Overall';
        render();
      });
    });
  }

  const sessions = GAME === 'ACC'
    ? (ACTIVE_CATEGORY !== 'All' ? gameSessions.filter(s => (s.category || 'Other') === ACTIVE_CATEGORY) : gameSessions)
    : (ACTIVE_SEASON !== 'All' ? gameSessions.filter(s => (s.season || 'Other') === ACTIVE_SEASON) : gameSessions);

  if (sessions.length === 0) {
    document.getElementById('session-tabs').innerHTML = '';
    const activeLabel = GAME === 'ACC' ? ACTIVE_CATEGORY : ACTIVE_SEASON;
    document.getElementById('board').innerHTML = `<div class="empty"><h2>No ${activeLabel} sessions yet</h2></div>`;
    return;
  }

  if (!ACTIVE_ID || !sessions.find(s => s.id === ACTIVE_ID)) {
    ACTIVE_ID = sessions[0].id;
  }

  document.getElementById('session-tabs').innerHTML = sessions.map(s => `
    <button class="session-tab" data-id="${s.id}" aria-selected="${s.id === ACTIVE_ID}">
      <span class="tab-main">${s.sessionName}<span class="track">${s.trackName}</span></span>
      <span class="date">${s.sessionDate || ''}</span>
    </button>
  `).join('');

  document.querySelectorAll('.session-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_ID = btn.dataset.id;
      ACTIVE_CLASS = 'Overall';
      render();
    });
  });

  const session = sessions.find(s => s.id === ACTIVE_ID);
  renderBoard(session);
}

function renderBoard(session) {
  if (session.game === 'LMU') {
    renderLmuBoard(session);
  } else {
    renderAccBoard(session);
  }
}

// ---- ACC: single flat `standings` array, with a combined "Overall" view ----
function renderAccBoard(session) {
  const isRace = session.sessionType.startsWith('R');
  const classes = ['Overall', ...new Set(session.standings.map(s => s.driverClass))];

  const rows = ACTIVE_CLASS === 'Overall'
    ? session.standings
    : session.standings.filter(s => s.driverClass === ACTIVE_CLASS);

  const leaderRef = rows[0]?.referenceTimeMs;
  const fastestMs = Math.min(...rows.map(r => r.bestLapMs ?? Infinity));

  const displayRows = rows.map((s, i) => {
    const position = ACTIVE_CLASS === 'Overall' ? s.position : s.classPosition;
    let gap = s.gap;
    if (ACTIVE_CLASS !== 'Overall') {
      const gapMs = (s.referenceTimeMs != null && leaderRef != null) ? s.referenceTimeMs - leaderRef : null;
      gap = i === 0 ? '-' : formatGap(gapMs);
    }
    return { ...s, position, gap, isFastestInView: s.bestLapMs === fastestMs };
  });

  const maxGapMs = Math.max(1, ...displayRows.map(s => (s.gap && s.gap !== '-') ? parseGapMs(s.gap) : 0));

  const rowsHtml = displayRows.map(s => {
    const gapMs = (s.gap && s.gap !== '-') ? parseGapMs(s.gap) : 0;
    const barPct = maxGapMs ? Math.min(100, (gapMs / maxGapMs) * 100) : 0;
    return `
      <tr>
        <td class="pos">${s.position}</td>
        <td class="num">#${s.raceNumber ?? '–'}</td>
        <td class="driver">
          ${s.driver}${s.hasMandatoryPitstopIssue ? '<span class="pit-flag">NO PIT</span>' : ''}
          <span class="car">${s.car} · ${s.driverClass}</span>
        </td>
        <td class="num">${s.laps ?? '–'}</td>
        <td class="time ${s.isFastestInView ? 'best' : ''}">${s.bestLap ?? '–'}</td>
        <td>
          <div class="gap-cell">
            <div class="gap-bar-track"><div class="gap-bar-fill" style="width:${barPct}%"></div></div>
            <span class="gap-value">${s.gap}</span>
          </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('board').innerHTML = `
    <div class="board-head">
      <h2>${session.sessionName} — ${session.trackName}</h2>
      <span class="meta">${session.isWetSession ? 'Wet' : 'Dry'} · ${session.penaltyCount} penalt${session.penaltyCount === 1 ? 'y' : 'ies'}</span>
    </div>
    <div class="class-tabs">
      ${classes.map(cls => `<button class="class-tab" data-class="${cls}" aria-selected="${cls === ACTIVE_CLASS}">${cls}</button>`).join('')}
    </div>
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Pos</th><th>No.</th><th>Driver</th><th>Laps</th><th>Best lap</th>
          <th>${isRace ? 'Gap' : 'Gap to P1'}</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    </div>
  `;

  document.querySelectorAll('.class-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_CLASS = btn.dataset.class;
      renderAccBoard(session);
    });
  });
}

// ---- LMU: classes kept fully separate, no combined "Overall" view ----
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtLap(ms) {
  if (ms == null) return '–';
  const m = Math.floor(ms / 60000);
  const sec = Math.floor((ms % 60000) / 1000);
  return `${m}:${String(sec).padStart(2, '0')}.${String(Math.round(ms % 1000)).padStart(3, '0')}`;
}
const fmtSector = ms => (ms == null ? '–' : (ms / 1000).toFixed(3));
const fmtDelta = ms => (ms == null ? '–' : ms === 0 ? '-' : `+${(ms / 1000).toFixed(3)}`);

const VIEW_LABELS = { results: 'Results', pace: 'Race pace', sectors: 'Sectors' };

function driverCell(s) {
  const flag = s.status && s.status !== 'FINISHED'
    ? `<span class="status-flag"${s.statusNote ? ` title="${esc(s.statusNote)}"` : ''}>${esc(s.status)}</span>` : '';
  return `<td class="driver">${esc(s.driver)}${flag}<span class="car">${esc(s.car || '')}</span></td>`;
}

// The standard results table (same as before).
function lmuResultsView(rows, isRace) {
  const leaderRef = rows[0]?.referenceTimeMs;
  const fastestMs = Math.min(...rows.map(r => r.bestLapMs ?? Infinity));
  const maxGapMs = Math.max(1, ...rows.map(r => {
    if (isRace) return parseRaceGapMs(r.gapDisplay) || 0;
    if (r.referenceTimeMs == null || leaderRef == null) return 0;
    return Math.max(0, r.referenceTimeMs - leaderRef);
  }));

  const body = rows.map((s, i) => {
    let gapDisplay, barPct;
    if (isRace) {
      gapDisplay = i === 0 ? '-' : (s.status !== 'FINISHED' ? s.status : (s.gapDisplay || '–'));
      const gapMs = parseRaceGapMs(s.gapDisplay);
      barPct = gapMs ? Math.min(100, (gapMs / maxGapMs) * 100) : (i === 0 ? 0 : 100);
    } else {
      const gapMs = (s.referenceTimeMs != null && leaderRef != null) ? s.referenceTimeMs - leaderRef : null;
      gapDisplay = i === 0 ? '-' : (s.status !== 'FINISHED' ? s.status : formatGap(gapMs));
      barPct = (maxGapMs && gapMs) ? Math.min(100, (gapMs / maxGapMs) * 100) : 0;
    }
    const isFastest = s.bestLapMs != null && s.bestLapMs === fastestMs;
    return `
      <tr>
        <td class="pos">${s.position}</td>
        <td class="num">#${esc(s.raceNumber ?? '–')}</td>
        ${driverCell(s)}
        <td class="num">${s.laps ?? '–'}</td>
        <td class="time ${isFastest ? 'best' : ''}">${s.bestLap ?? '–'}</td>
        <td>
          <div class="gap-cell">
            <div class="gap-bar-track"><div class="gap-bar-fill" style="width:${barPct}%"></div></div>
            <span class="gap-value">${gapDisplay}</span>
          </div>
        </td>
      </tr>`;
  }).join('');

  return {
    head: `<th>Pos</th><th>No.</th><th>Driver</th><th>Laps</th><th>Best lap</th><th>${isRace ? 'Gap' : 'Gap to P1'}</th>`,
    body,
  };
}

// Race pace: average of clean laps (no lap 1, pit laps, out-laps or laps >107% of the driver's median).
function lmuPaceView(rows) {
  const bestPace = Math.min(...rows.map(r => r.avgPaceMs ?? Infinity));
  const body = rows.map(s => {
    const g = s.positionsGained;
    const moved = g == null ? '–' : g > 0 ? `<span class="up">▲${g}</span>` : g < 0 ? `<span class="down">▼${-g}</span>` : '–';
    return `
      <tr>
        <td class="pos">${s.position}</td>
        <td class="num">#${esc(s.raceNumber ?? '–')}</td>
        ${driverCell(s)}
        <td class="time ${s.avgPaceMs != null && s.avgPaceMs === bestPace ? 'best' : ''}">${fmtLap(s.avgPaceMs)}</td>
        <td class="num nw">${fmtDelta(s.paceGapMs)}</td>
        <td class="num nw">${s.consistencyMs != null ? '±' + (s.consistencyMs / 1000).toFixed(2) + 's' : '–'}</td>
        <td class="num">${s.pitstops ?? '–'}</td>
        <td class="num nw">${esc(s.tyres || '–')}</td>
        <td class="num nw">${s.topSpeed != null ? Math.round(s.topSpeed) + ' km/h' : '–'}</td>
        <td class="num">${s.gridPosition ?? '–'}</td>
        <td class="num">${moved}</td>
      </tr>`;
  }).join('');
  return {
    head: '<th>Pos</th><th>No.</th><th>Driver</th><th>Avg pace</th><th>Gap to best</th><th>Consistency</th><th>Pits</th><th>Tyres</th><th>Top speed</th><th>Start</th><th>+/-</th>',
    body,
  };
}

// Best sector times and the "ideal lap" (best S1 + best S2 + best S3).
function lmuSectorsView(rows) {
  const minOf = k => Math.min(...rows.map(r => r[k] ?? Infinity));
  const best = { s1: minOf('bestS1Ms'), s2: minOf('bestS2Ms'), s3: minOf('bestS3Ms'), ideal: minOf('idealLapMs'), lap: minOf('bestLapMs') };
  const cell = (v, b, fmt) => `<td class="time ${v != null && v === b ? 'best' : ''}">${fmt(v)}</td>`;
  const body = rows.map(s => `
      <tr>
        <td class="pos">${s.position}</td>
        <td class="num">#${esc(s.raceNumber ?? '–')}</td>
        ${driverCell(s)}
        ${cell(s.bestS1Ms, best.s1, fmtSector)}
        ${cell(s.bestS2Ms, best.s2, fmtSector)}
        ${cell(s.bestS3Ms, best.s3, fmtSector)}
        ${cell(s.idealLapMs, best.ideal, fmtLap)}
        ${cell(s.bestLapMs, best.lap, fmtLap)}
      </tr>`).join('');
  return {
    head: '<th>Pos</th><th>No.</th><th>Driver</th><th>Best S1</th><th>Best S2</th><th>Best S3</th><th>Ideal lap</th><th>Best lap</th>',
    body,
  };
}

function renderLmuBoard(session) {
  const isRace = session.sessionType === 'R';
  const classNames = Object.keys(session.standingsByClass || {});

  if (classNames.length === 0) {
    document.getElementById('board').innerHTML = `<div class="empty"><h2>No results in this session</h2></div>`;
    return;
  }

  if (ACTIVE_CLASS === 'Overall' || !classNames.includes(ACTIVE_CLASS)) {
    ACTIVE_CLASS = classNames[0];
  }

  // Sessions built from the game's result files carry lap-by-lap data, so they
  // get extra views. Sessions from SimGrid pages only have the results table.
  const views = session.source !== 'xml' ? ['results'] : isRace ? ['results', 'pace', 'sectors'] : ['results', 'sectors'];
  if (!views.includes(ACTIVE_VIEW)) ACTIVE_VIEW = 'results';

  const rows = session.standingsByClass[ACTIVE_CLASS] || [];
  const table = ACTIVE_VIEW === 'pace' ? lmuPaceView(rows)
    : ACTIVE_VIEW === 'sectors' ? lmuSectorsView(rows)
    : lmuResultsView(rows, isRace);

  const viewTabs = views.length > 1
    ? `<div class="view-tabs">${views.map(v => `<button class="view-tab" data-view="${v}" aria-selected="${v === ACTIVE_VIEW}">${VIEW_LABELS[v]}</button>`).join('')}</div>`
    : '';
  const duration = isRace && session.raceMinutes ? `${session.raceMinutes} min · ` : '';

  document.getElementById('board').innerHTML = `
    <div class="board-head">
      <h2>${esc(session.sessionName)} — ${esc(session.trackName)}</h2>
      <span class="meta">${duration}${session.totalDrivers ?? rows.length} driver(s)</span>
    </div>
    <div class="class-tabs">
      ${classNames.map(cls => `<button class="class-tab" data-class="${esc(cls)}" aria-selected="${cls === ACTIVE_CLASS}">${esc(cls)}</button>`).join('')}
    </div>
    ${viewTabs}
    <div class="table-scroll">
    <table>
      <thead><tr>${table.head}</tr></thead>
      <tbody>${table.body}</tbody>
    </table>
    </div>
  `;

  document.querySelectorAll('.class-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_CLASS = btn.dataset.class;
      renderLmuBoard(session);
    });
  });
  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      ACTIVE_VIEW = btn.dataset.view;
      renderLmuBoard(session);
    });
  });
}

function formatGap(ms) {
  if (ms == null) return '–';
  if (ms <= 0) return '-';
  const totalMs = Math.round(ms);
  const minutes = Math.floor(totalMs / 60000);
  const seconds = ((totalMs % 60000) / 1000).toFixed(3);
  return minutes > 0 ? `+${minutes}:${seconds.padStart(6, '0')}` : `+${seconds}`;
}

function parseGapMs(gapStr) {
  // "+1:23.456" or "+12.345"
  const clean = gapStr.replace('+', '');
  const parts = clean.split(':');
  if (parts.length === 2) {
    return (parseInt(parts[0], 10) * 60 + parseFloat(parts[1])) * 1000;
  }
  return parseFloat(clean) * 1000;
}

// Parses SimGrid's own race gap text ("+39.800", "+1:38.461") back to ms for
// the proportional gap bar. Lap-based gaps ("+2 Laps") can't convert to a
// time, so those just render a full bar to visually flag "laps behind".
function parseRaceGapMs(gapText) {
  if (!gapText) return null;
  if (/lap/i.test(gapText)) return null;
  return parseGapMs(gapText);
}

load();
</script>
</body>
</html>
